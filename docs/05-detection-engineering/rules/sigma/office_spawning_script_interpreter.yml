title: Office Application Launching a Script Interpreter or Shell
id: 73edeea5-4e3f-4b0f-affa-7d7944dfff74
status: experimental
description: |
    Detects a Microsoft Office application starting a command shell, PowerShell,
    a Windows script host or the HTML application host. Documents that abuse
    macros, embedded objects or template injection typically reach code
    execution this way, so the pattern is a strong signal of a malicious
    attachment being opened. Check the document name and source email, the
    child command line and any network connection made by the child process.
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/
author: The Defensive Mind
date: 2026-10-27
tags:
    - attack.initial-access
    - attack.t1566.001
    - attack.execution
    - attack.t1204.002
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\OUTLOOK.EXE'
            - '\MSACCESS.EXE'
            - '\MSPUB.EXE'
            - '\ONENOTE.EXE'
            - '\VISIO.EXE'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\bash.exe'
            - '\wsl.exe'
    condition: all of selection_*
fields:
    - ParentImage
    - ParentCommandLine
    - Image
    - CommandLine
    - User
falsepositives:
    - Business macros or add-ins that call a script by design (document the file hash or path and filter it)
    - Finance or reporting workbooks that shell out to a command line tool
level: high
