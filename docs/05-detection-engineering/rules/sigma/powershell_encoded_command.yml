title: PowerShell Started with a Base64 Encoded Command
id: 7316cce5-80e4-4377-8e98-4e3a2cb19435
status: experimental
description: |
    Detects PowerShell launched with the encoded command switch, including its
    accepted abbreviations. Encoding hides the real script from casual review
    and from simple keyword matching, which is why commodity malware, loaders
    and many intrusion kits use it. Some legitimate management tools do too, so
    decode the argument during triage and judge the content, the parent process
    and the user. Raise priority when the parent is an Office application,
    a browser, a script host or a web server process.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: The Defensive Mind
date: 2026-10-27
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
    selection_switch:
        CommandLine|contains|windash:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -enco'
            - ' -ec '
    condition: all of selection_*
fields:
    - ParentImage
    - Image
    - CommandLine
    - User
falsepositives:
    - Configuration management, remote monitoring and software deployment agents
    - Administrator scripts that pass encoded payloads to avoid quoting problems
level: medium
