title: Browser Saved-Password Store Read by a Non-Browser Process
id: b6a94d2f-8a6d-4e3a-a3ba-e4e2a702f447
status: experimental
description: |
    Detects a process other than the browser itself opening the files where
    Chromium-based browsers and Firefox keep saved passwords and the keys that
    protect them. Information stealers read these files within seconds of
    running, copy them and send them out. This rule needs file access
    telemetry, which comes from an Endpoint Detection and Response (EDR) agent
    or from object access auditing on the profile folders; it will be silent
    without that data. Add your approved backup and security tools to the
    filter after reviewing them.
references:
    - https://attack.mitre.org/techniques/T1555/003/
author: The Defensive Mind
date: 2026-10-27
tags:
    - attack.credential-access
    - attack.t1555.003
logsource:
    category: file_access
    product: windows
detection:
    selection_store:
        TargetFilename|endswith:
            - '\User Data\Default\Login Data'
            - '\User Data\Local State'
            - '\logins.json'
            - '\key4.db'
    selection_store_profiles:
        TargetFilename|contains: '\User Data\Profile '
        TargetFilename|endswith: '\Login Data'
    filter_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\vivaldi.exe'
    filter_system:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\ProgramData\Microsoft\Windows Defender\'
    condition: 1 of selection_* and not 1 of filter_*
fields:
    - Image
    - TargetFilename
    - User
falsepositives:
    - Backup and file synchronisation agents that read the whole user profile
    - Password manager import features
    - Browser updaters stored outside the browser folder
level: medium
