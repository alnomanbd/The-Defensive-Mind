title: Web Request for Sensitive Configuration or Repository Files
id: af617be8-24b7-490b-add3-0d9140022632
status: experimental
description: |
    Flags HTTP requests for files that should never be served by a public web
    server, such as environment files, version-control metadata, backup archives
    and cloud credential files. Automated scanners request these paths in bulk
    hoping a deployment mistake exposed secrets. A single hit is usually noise;
    a hit that returns HTTP 200, or many hits from one source, deserves triage.
    Raise priority when the response status is 200 and the response size is
    larger than a typical error page.
references:
    - https://attack.mitre.org/techniques/T1595/003/
    - https://attack.mitre.org/techniques/T1552/001/
author: The Defensive Mind
date: 2026-10-27
tags:
    - attack.reconnaissance
    - attack.t1595.003
    - attack.credential-access
    - attack.t1552.001
logsource:
    category: webserver
detection:
    selection_secret_paths:
        cs-uri-stem|contains:
            - '/.env'
            - '/.git/config'
            - '/.git/HEAD'
            - '/.svn/entries'
            - '/.hg/hgrc'
            - '/.aws/credentials'
            - '/.ssh/id_rsa'
            - '/.htpasswd'
            - '/.DS_Store'
            - '/wp-config.php.bak'
            - '/config.php.bak'
            - '/web.config.bak'
            - '/docker-compose.yml'
            - '/.npmrc'
            - '/.pypirc'
    selection_backup_archives:
        cs-uri-stem|endswith:
            - '/backup.zip'
            - '/backup.tar.gz'
            - '/site.zip'
            - '/db.sql'
            - '/dump.sql'
            - '/database.sql'
    condition: 1 of selection_*
fields:
    - c-ip
    - cs-method
    - cs-uri-stem
    - sc-status
    - cs-user-agent
falsepositives:
    - Authorised vulnerability scanners and external attack surface monitoring services
    - Developers testing a misconfiguration fix
    - Frameworks that legitimately expose a public file with a similar name (verify the full path)
level: medium
