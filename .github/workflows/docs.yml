name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build (strict - fails on broken links)
        run: mkdocs build --strict
      - name: Validate Sigma rules (YAML syntax)
        run: |
          pip install pyyaml
          python - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob("docs/05-detection-engineering/rules/sigma/*.yml"):
              try:
                  d = yaml.safe_load(open(f, encoding="utf-8"))
                  for k in ("title", "id", "logsource", "detection", "level"):
                      assert k in d, f"{k} missing"
              except Exception as e:
                  print(f"{f}: {e}"); bad += 1
          sys.exit(bad)
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
